orm:translate(-50%,-50%) rotateX(10deg) rotateY(-14deg);z-index:3;filter:drop-shadow(0 0 60px #4fd5ef20)}.core:before{content:"";position:absolute;inset:0;clip-path:polygon(44% 0,56% 0,100% 50%,56% 100%,44% 100%,0 50%);background:linear-gradient(90deg,transparent,#0b2733,#183e4b,#06141c,transparent);opacity:.9}.beam{position:absolute;left:50%;top:12%;height:76%;width:3px;transform:translateX(-50%);background:linear-gradient(transparent,var(--c),#fff,var(--v),transparent);box-shadow:0 0 25px 5px #79eaff55;animation:b 3s infinite}.slice{position:absolute;left:50%;top:50%;width:280px;height:90px;transform:translate(-50%,-50%) rotate(-10deg);border:1px solid #79eaff45;border-radius:50%;animation:s 5s infinite}.slice:nth-child(2){transform:translate(-50%,-50%) rotate(14deg);border-color:#9a88ff3d;animation-delay:-2s}.slice:nth-child(3){width:170px;border-color:#77efbd2d;animation-delay:-3s}.node{position:absolute;z-index:5;padding:10px 13px;border-left:1px solid #79eaff55;background:linear-gradient(90deg,#06141dcc,transparent);font:6px monospace;color:#526570;letter-spacing:.18em}.node strong{display:block;color:#cce8f0;font:9px system-ui;letter-spacing:.05em;margin-top:5px}.n1{right:14%;top:28%}.n2{right:18%;bottom:27%}.n3{left:30%;top:35%}.reply{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);width:min(760px,70vw);text-align:center;z-index:8;opacity:0;transition:.4s;pointer-events:none}.reply.show{opacity:1}.reply label{color:var(--c);font:6px monospace;letter-spacing:.3em}.reply p{font-size:24px;font-weight:300;margin:10px 0}.command{position:absolute;left:50%;bottom:47px;transform:translateX(-50%);width:min(760px,calc(100% - 80px));z-index:10;display:flex;align-items:center;border-bottom:1px solid #79eaff55;padding-bottom:10px}.command button{background:none;border:0;color:var(--c);font-size:20px;cursor:pointer}.command input{flex:1;background:none;border:0;outline:0;color:white;font-size:15px;margin:0 12px}.command input::placeholder{color:#526570}.foot{position:absolute;left:50px;bottom:47px;color:#40525c;font:6px monospace;letter-spacing:.2em}@keyframes b{0%,100%{opacity:.45;transform:translateX(-50%) scaleY(.8)}50%{opacity:1;transform:translateX(-50%) scaleY(1.05)}}@keyframes s{0%,100%{opacity:.25;scale:.82}50%{opacity:.85;scale:1.15}}@media(max-width:800px){.rail,.n3,.foot{display:none}.brand{left:28px}.online{right:28px}.core{width:210px;height:390px}.reply{width:88vw}.reply p{font-size:19px}.command{width:calc(100% - 40px)}}</style></head><body><main id="a"><canvas id="c"></canvas><div class="border"></div><header class="brand"><div class="mark"><span>W</span></div><div><h1>WULAN</h1><small>PERSONAL INTELLIGENCE</small></div></header><div class="online"><i class="dot"></i>ONLINE · <span id="t"></span></div><nav class="rail"><label>NAVIGATE</label><button class="on" data-x="presence"><b>01</b>Presence</button><button data-x="memory"><b>02</b>Memory</button><button data-x="tools"><b>03</b>Tools</button><button data-x="world"><b>04</b>Your world</button></nav><section class="core"><i class="slice"></i><i class="slice"></i><i class="slice"></i><i class="beam"></i></section><div class="node n1">CONNECTED<strong>SENTINEL</strong></div><div class="node n2">RETAINED<strong>MEMORY</strong></div><div class="node n3">READY<strong>WULAN CORE</strong></div><section class="reply" id="r"><label>WULAN</label><p id="rt">I'm here.</p></section><form class="command" id="f"><button type="button">◉</button><input id="i" placeholder="Talk to Wulan…" autocomplete="off"><button>↗</button></form><div class="foot">LOCAL · COGNITIVE FIELD</div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),a=document.getElementById('a'),core=document.querySelector('.core'),r=document.getElementById('r'),rt=document.getElementById('rt'),inp=document.getElementById('i');let w,h,d,px=.5,py=.5;function z(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}z();onresize=z;onpointermove=e=>{px=e.clientX/w;py=e.clientY/h;core.style.transform=`translate(calc(-50% + ${(px-.5)*32}px),calc(-50% + ${(py-.5)*22}px)) rotateX(10deg) rotateY(-14deg)`};let q=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),s:Math.random(),a:.1+Math.random()*.5}));function draw(){x.clearRect(0,0,w,h);q.forEach((p,j)=>{p.y-=.00008*p.s;if(p.y<0)p.y=1;let X=p.x*w,Y=p.y*h;x.fillStyle=`rgba(120,220,240,${p.a*p.s})`;x.fillRect(X,Y,1+p.s*1.4,1+p.s*1.4);if(p.s>.65)for(let k=j+1;k<q.length;k++){let u=q[k],dx=(p.x-u.x)*w,dy=(p.y-u.y)*h,D=Math.hypot(dx,dy);if(D<85){x.strokeStyle=`rgba(110,210,235,${(1-D/85)*.05*p.s})`;x.beginPath();x.moveTo(X,Y);x.lineTo(u.x*w,u.y*h);x.stroke()}}});requestAnimationFrame(draw)}draw();setInterval(()=>document.getElementById('t').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);function say(s){rt.textContent=s;r.classList.remove('show');requestAnimationFrame(()=>r.classList.add('show'))}f.onsubmit=e=>{e.preventDefault();let s=inp.value.trim();if(!s)return;inp.value='';say(/sentinel/i.test(s)?'Sentinel is within reach.':/memory/i.test(s)?'Memory is quiet until you need it.':/hello|hi|hey/i.test(s)?'Hey. I’m here.':'I’m with you. What are we building?')};document.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rail button').forEach(q=>q.classList.remove('on'));b.classList.add('on');let m=b.dataset.x;say(m==='memory'?'Memory is quiet until you need it.':m==='tools'?'Your tools are connected.':m==='world'?'Your world is open.':'I’m here.')});</script></body></html>
