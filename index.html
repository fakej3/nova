<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010407">
<meta name="description" content="Wulan — personal intelligence system">
<title>WULAN — Personal Intelligence</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#wulan-visual{position:fixed;inset:0;width:100%;height:100%;border:0;background:#010407}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:#010407;color:#79efff;font:7px ui-monospace,monospace;letter-spacing:.3em;z-index:10;transition:opacity .35s ease}
.boot.hidden{opacity:0;pointer-events:none}
.boot i{width:5px;height:5px;border-radius:50%;background:#73f0b0;box-shadow:0 0 18px #73f0b0;display:inline-block;margin-right:8px;animation:p 1s infinite}
@keyframes p{50%{opacity:.35;transform:scale(.7)}}
</style>
</head>
<body>
<div class="boot" id="boot"><span><i></i>WULAN CORE</span></div>
<iframe id="wulan-visual" title="Wulan visual interface" src="wulan-space-visual.html"></iframe>
<script type="module" src="wulan-space-runtime.js"></script>
<script>addEventListener('load',()=>setTimeout(()=>document.getElementById('boot')?.classList.add('hidden'),120),{once:true});</script>
</body>
</html>
