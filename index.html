<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Wulan — personal AI operating system">
<title>WULAN — Personal AI</title>
<link rel="stylesheet" href="css/nova2.css">
</head>
<body>
<canvas id="nova-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<main class="app">
  <header class="topbar">
    <div class="identity"><div class="mark">W</div><div><strong>WULAN</strong><span>PERSONAL AI</span></div></div>
    <div class="presence"><i></i><span id="presence-text">HERE</span><time id="clock">--:--</time></div>
  </header>

  <section class="scene" aria-label="Wulan presence">
    <div class="hello"><span id="eyebrow">WULAN</span><h1 id="headline">I'm here.</h1><p id="subline">quiet · aware · waiting</p></div>
    <div id="presence-core" class="presence-core" aria-label="Wulan">
      <div class="core-shadow"></div><div class="core-form"><span></span><span></span><span></span></div>
      <div class="core-eye"><i></i></div>
    </div>
    <div class="ambient-label label-memory" id="memory-label">MEMORY <b>0</b></div>
    <div class="ambient-label label-agents" id="agents-label">AGENTS <b>4</b></div>
    <div class="ambient-label label-context" id="context-label">CONTEXT <b>LOCAL</b></div>
  </section>

  <aside class="activity" id="activity" aria-live="polite">
    <div class="activity-top"><span>WULAN</span><b id="activity-state">READY</b></div>
    <div id="activity-line">Listening for you.</div>
  </aside>

  <section class="conversation" aria-label="Conversation with Wulan">
    <div class="messages" id="messages">
      <div class="message wulan"><span class="message-name">WULAN</span><p>Hey. I'm here.</p></div>
    </div>
    <form class="composer" id="composer">
      <button type="button" class="voice" id="voice" aria-label="Voice input"><span>◉</span></button>
      <input id="nova-input" autocomplete="off" placeholder="Talk to Wulan…" aria-label="Talk to Wulan">
      <button class="send" id="nova-send" aria-label="Send"><span>↗</span></button>
    </form>
    <div class="hint"><span>local-first</span><span id="memory-hint">memory ready</span><span id="provider-hint">AI gateway · waiting for provider</span></div>
  </section>

  <nav class="quick" aria-label="Quick actions">
    <button data-action="memory">Memory</button><button data-action="agents">Agents</button><button data-action="projects">Projects</button><button data-action="systems">Systems</button>
  </nav>
</main>
<script type="module" src="wulan2-shell.js"></script>
</body>
</html>
