<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WULAN — Presence</title>
<style>
:root{--bg:#02050a;--fg:#e9f8ff;--muted:#5d7285;--cyan:#73e6ff;--blue:#5b9dff;--violet:#a28cff;--line:rgba(125,220,255,.16)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
body{background:radial-gradient(circle at 50% 50%,#0b1b29 0,#030912 34%,#010307 76%)}
#world{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 53%,rgba(31,99,133,.12),transparent 28%),linear-gradient(180deg,#030810,#010307)}
#space{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.3) 70%,rgba(0,0,0,.8) 100%)}
.scan{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.07;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(170,230,255,.18) 4px);mix-blend-mode:screen}
.top{position:absolute;z-index:20;top:26px;left:30px;right:30px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.glyph{width:38px;height:38px;border:1px solid rgba(115,230,255,.55);border-radius:12px;display:grid;place-items:center;color:var(--cyan);font:600 11px ui-monospace,monospace;box-shadow:0 0 30px rgba(115,230,255,.07),inset 0 0 18px rgba(115,230,255,.04)}.brand b{font-size:12px;letter-spacing:.28em}.brand small{display:block;color:#4d6276;font:500 6px ui-monospace,monospace;letter-spacing:.2em;margin-top:3px}.online{display:flex;align-items:center;gap:7px;color:#587084;font:500 6px ui-monospace,monospace;letter-spacing:.18em}.online i{width:5px;height:5px;border-radius:50%;background:#7ff0c0;box-shadow:0 0 12px #7ff0c0}
/* the actual interface is the presence, not a dashboard */
.presence{position:absolute;z-index:8;left:50%;top:50%;width:min(68vh,62vw,720px);height:min(68vh,62vw,720px);transform:translate(-50%,-50%);transition:transform .8s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 0 50px rgba(70,180,230,.08))}.presence:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(78,193,232,.11),rgba(49,103,145,.035) 35%,transparent 67%);filter:blur(25px);animation:breathe 5s ease-in-out infinite}.halo{position:absolute;inset:8%;border:1px solid rgba(115,230,255,.08);border-radius:50%;transform:rotateX(67deg);box-shadow:0 0 60px rgba(115,230,255,.025);animation:orbit 22s linear infinite}.halo.two{inset:18%;transform:rotateX(67deg) rotateZ(42deg);border-color:rgba(162,140,255,.1);animation-duration:15s;animation-direction:reverse}.halo.three{inset:29%;transform:rotateX(67deg) rotateZ(-31deg);border-color:rgba(127,240,192,.08);animation-duration:11s}.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(115,230,255,.1)}.r1{width:72%;height:72%}.r2{width:51%;height:51%;border-color:rgba(115,230,255,.14)}.r3{width:32%;height:32%;border-color:rgba(162,140,255,.18)}
.core{position:absolute;left:50%;top:50%;width:170px;height:170px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 48% 42%,rgba(218,251,255,.95) 0 1.5%,rgba(115,230,255,.42) 7%,rgba(52,141,180,.13) 25%,rgba(7,25,38,.28) 50%,transparent 70%);box-shadow:0 0 35px rgba(115,230,255,.2),0 0 120px rgba(66,176,221,.1);animation:core 4.5s ease-in-out infinite}.core:before,.core:after{content:"";position:absolute;inset:8%;border:1px solid rgba(176,239,255,.25);border-radius:47% 53% 49% 51%;transform:rotate(28deg) scaleX(.66);animation:spin 8s linear infinite}.core:after{inset:17%;border-color:rgba(162,140,255,.22);transform:rotate(-37deg) scaleY(.68);animation-duration:5.5s;animation-direction:reverse}.eye{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);border-radius:50%;background:#e9fcff;box-shadow:0 0 20px 7px rgba(115,230,255,.5);animation:eye 3s ease-in-out infinite}.arc{position:absolute;left:50%;top:50%;width:84%;height:84%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid transparent;border-top-color:rgba(115,230,255,.45);border-right-color:rgba(115,230,255,.1);animation:spin 9s linear infinite}.arc.a2{width:64%;height:64%;border-top-color:rgba(162,140,255,.5);border-left-color:rgba(162,140,255,.1);animation-duration:6s;animation-direction:reverse}.arc.a3{width:43%;height:43%;border-bottom-color:rgba(127,240,192,.4);animation-duration:4s}
.orbit-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#bdf4ff;box-shadow:0 0 14px #73e6ff;transform-origin:0 0}.d1{animation:dot1 7s linear infinite}.d2{animation:dot2 10s linear infinite}.d3{animation:dot3 13s linear infinite}
.command{position:absolute;z-index:30;left:50%;bottom:34px;transform:translateX(-50%);width:min(700px,calc(100% - 42px));height:64px;border:1px solid rgba(125,220,255,.2);border-radius:20px;background:rgba(3,10,17,.72);backdrop-filter:blur(28px);display:flex;align-items:center;padding:8px;box-shadow:0 25px 100px rgba(0,0,0,.55),inset 0 0 30px rgba(115,230,255,.025);transition:.35s}.command:focus-within{border-color:rgba(115,230,255,.48);box-shadow:0 25px 100px rgba(0,0,0,.6),0 0 80px rgba(115,230,255,.09)}.voice{width:46px;height:46px;border-radius:15px;border:1px solid rgba(115,230,255,.16);background:rgba(115,230,255,.035);color:var(--cyan);display:grid;place-items:center}.voice i{width:7px;height:7px;border:1px solid #6d8598;border-radius:50%}.voice.active i{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 7px rgba(115,230,255,.08),0 0 22px rgba(115,230,255,.6)}#input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#edfaff;padding:0 13px;font-size:14px}#input::placeholder{color:#536a7d}.send{width:46px;height:46px;border-radius:15px;border:1px solid rgba(115,230,255,.22);background:rgba(115,230,255,.05);color:var(--cyan);font-size:19px}.send:hover{background:rgba(115,230,255,.12);border-color:rgba(115,230,255,.5)}
/* information appears only when there is a reason for it */
.context{position:absolute;z-index:18;left:32px;bottom:130px;width:190px;color:#617589;font:500 7px ui-monospace,monospace;letter-spacing:.12em;opacity:.75}.context .line{height:1px;background:linear-gradient(90deg,rgba(115,230,255,.3),transparent);margin:9px 0}.context b{display:block;color:#b8d1de;font-size:8px;letter-spacing:.08em}.context span{color:#4d6478}.modules{position:absolute;z-index:18;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}.module{width:130px;padding:10px 11px;border-left:1px solid rgba(115,230,255,.18);background:linear-gradient(90deg,rgba(4,14,23,.55),transparent);color:#4f667a;font:500 6px ui-monospace,monospace;letter-spacing:.15em}.module b{display:block;color:#a7c5d4;font-size:7px;margin-top:4px}.conversation{position:absolute;z-index:25;left:50%;bottom:112px;transform:translateX(-50%);width:min(620px,calc(100% - 42px));display:flex;flex-direction:column;gap:8px;max-height:170px;overflow:hidden;pointer-events:none}.msg{align-self:flex-start;max-width:75%;padding:10px 13px;border:1px solid rgba(115,230,255,.15);border-radius:13px;background:rgba(3,10,17,.76);backdrop-filter:blur(20px);animation:in .3s ease}.msg.user{align-self:flex-end;border-color:rgba(115,230,255,.25);background:rgba(41,116,147,.1)}.msg small{display:block;color:var(--cyan);font:500 5px ui-monospace,monospace;letter-spacing:.2em;margin-bottom:4px}.msg p{margin:0;font-size:11px;line-height:1.45;color:#d8eaf3}.wake{position:absolute;z-index:16;left:50%;top:calc(50% + min(34vh,31vw,360px));transform:translateX(-50%);color:#516a7c;font:500 6px ui-monospace,monospace;letter-spacing:.24em;white-space:nowrap;transition:.5s}.wake strong{color:#8cb9cb;font-weight:500}.wake.hidden{opacity:0;transform:translate(-50%,8px)}
@keyframes breathe{0%,100%{scale:.88;opacity:.55}50%{scale:1.12;opacity:1}}@keyframes core{0%,100%{scale:.93;filter:brightness(.9)}50%{scale:1.06;filter:brightness(1.18)}}@keyframes eye{50%{scale:1.5;box-shadow:0 0 26px 10px rgba(115,230,255,.65)}}@keyframes spin{to{rotate:360deg}}@keyframes orbit{to{rotate:360deg}}@keyframes dot1{from{transform:rotate(0) translateX(270px)}to{transform:rotate(360deg) translateX(270px)}}@keyframes dot2{from{transform:rotate(110deg) translateX(205px)}to{transform:rotate(470deg) translateX(205px)}}@keyframes dot3{from{transform:rotate(210deg) translateX(155px)}to{transform:rotate(-150deg) translateX(155px)}}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:900px){.modules,.context{display:none}.presence{width:min(88vw,620px);height:min(88vw,620px)}.command{bottom:20px}.wake{top:calc(50% + 39vw)}}@media(max-width:560px){.top{top:16px;left:18px;right:18px}.online{display:none}.presence{width:118vw;height:118vw}.core{width:130px;height:130px}.command{width:calc(100% - 24px);height:58px;bottom:12px}.voice,.send{width:42px;height:42px}.conversation{bottom:84px}.wake{display:none}}
</style>
</head>
<body>
<main id="world">
<canvas id="space"></canvas><div class="vignette"></div><div class="scan"></div>
<header class="top"><div class="brand"><div class="glyph">W</div><div><b>WULAN</b><small>PERSONAL INTELLIGENCE</small></div></div><div class="online"><i></i> PRESENT · <span id="clock"></span></div></header>
<section class="presence" id="presence" aria-label="Wulan presence"><div class="halo"></div><div class="halo two"></div><div class="halo three"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="arc"></div><div class="arc a2"></div><div class="arc a3"></div><div class="core"><div class="eye"></div></div><i class="orbit-dot d1"></i><i class="orbit-dot d2"></i><i class="orbit-dot d3"></i></section>
<div class="wake" id="wake"><strong>WULAN</strong> IS HERE</div>
<aside class="context"><span>CONNECTED CONTEXT</span><div class="line"></div><b id="contextTitle">YOUR WORLD</b><span id="contextSub">ready when you are</span><div class="line"></div><span id="memory">MEMORY · 14</span></aside>
<aside class="modules"><div class="module">MEMORY<b>14 retained</b></div><div class="module">SENTINEL<b>available</b></div><div class="module">PROJECTS<b>connected</b></div></aside>
<section class="conversation" id="conversation" aria-live="polite"></section>
<form class="command" id="composer"><button class="voice" id="voice" type="button" aria-label="Voice"><i></i></button><input id="input" autocomplete="off" placeholder="Speak to Wulan…"><button class="send" type="submit" aria-label="Send">↗</button></form>
</main>
<script>
const world=document.getElementById('world'),presence=document.getElementById('presence'),canvas=document.getElementById('space'),ctx=canvas.getContext('2d'),input=document.getElementById('input'),conversation=document.getElementById('conversation'),wake=document.getElementById('wake'),voice=document.getElementById('voice');
let W,H,dpr,mouse={x:.5,y:.5},active=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{mouse.x=e.clientX/W;mouse.y=e.clientY/H;presence.style.transform=`translate(calc(-50% + ${(mouse.x-.5)*22}px),calc(-50% + ${(mouse.y-.5)*18}px))`});
const pts=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.4,a:.18+Math.random()*.45,v:(Math.random()-.5)*.00004}));
function draw(t){ctx.clearRect(0,0,W,H);for(const p of pts){p.y+=p.v;if(p.y<0)p.y=1;if(p.y>1)p.y=0;const x=p.x*W+(mouse.x-.5)*10,y=p.y*H+(mouse.y-.5)*8;ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(150,225,245,${p.a})`;ctx.fill()}for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=(a.x-b.x)*W,dy=(a.y-b.y)*H,d=Math.hypot(dx,dy);if(d<115){ctx.strokeStyle=`rgba(100,195,225,${(1-d/115)*.035})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function wakeUp(){if(active)return;active=true;wake.classList.add('hidden');presence.style.filter='drop-shadow(0 0 75px rgba(70,200,245,.18))';setTimeout(()=>presence.style.filter='',900)}
function add(text,who){const el=document.createElement('div');el.className='msg '+(who==='user'?'user':'');el.innerHTML=`<small>${who==='user'?'YOU':'WULAN'}</small><p></p>`;el.querySelector('p').textContent=text;conversation.appendChild(el);while(conversation.children.length>4)conversation.firstChild.remove()}
document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;wakeUp();add(text,'user');input.value='';setTimeout(()=>{let reply='I’m here. Tell me what you want to connect.';if(/sentinel/i.test(text))reply='Sentinel is connected. I can inspect the live system when you ask.';else if(/hello|hi|hey/i.test(text))reply='Hey. I’m here.';else if(/memory/i.test(text))reply='I remember what you choose to keep. Ask me about it.';add(reply,'wulan')},450)});
voice.addEventListener('click',()=>{wakeUp();voice.classList.toggle('active');if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-IN';r.onresult=e=>{input.value=e.results[0][0].transcript;voice.classList.remove('active');document.getElementById('composer').requestSubmit()};r.onend=()=>voice.classList.remove('active');r.start()}else{input.focus()}});world.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;wakeUp()});
</script>
</body>
</html>
