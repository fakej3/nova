<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060b">
<meta name="description" content="Wulan — a living personal AI interface">
<title>WULAN — Personal AI</title>
<link rel="stylesheet" href="css/nova2.css">
</head>
<body>
<canvas id="nova-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<main class="app">
  <header class="topbar">
    <button class="identity" id="identity" aria-label="Wake Wulan"><span class="mark">W</span><span><strong>WULAN</strong><em>PERSONAL AI</em></span></button>
    <div class="presence"><i></i><span id="presence-text">QUIET</span><time id="clock">--:--</time></div>
  </header>

  <section class="world" aria-label="Wulan living space">
    <div class="intro"><span id="eyebrow">PRESENT</span><h1 id="headline">I'm here.</h1><p id="subline">quiet · aware · waiting</p></div>

    <div class="presence-core" id="presence-core" role="button" tabindex="0" aria-label="Interact with Wulan">
      <div class="core-aura"></div>
      <div class="core-ripple"></div>
    </div>

    <div class="attention" id="attention"><span class="attention-dot"></span><div><b id="attention-title">Listening for you</b><small id="attention-detail">Wulan is quiet until you give her something to do.</small></div></div>

    <section class="context-orbit" id="context-orbit" aria-label="Active context">
      <button class="context-card memory-card" data-context="memory"><span class="context-icon">M</span><span><b>Memory</b><small id="memory-count">quiet</small></span></button>
      <button class="context-card sentinel-card" data-context="sentinel"><span class="context-icon">S</span><span><b>Sentinel</b><small>integration</small></span></button>
      <button class="context-card edge-card" data-context="edge"><span class="context-icon">E</span><span><b>EdgeLab</b><small>integration</small></span></button>
      <button class="context-card project-card" data-context="projects"><span class="context-icon">P</span><span><b>Projects</b><small>your world</small></span></button>
    </section>

    <div class="activity-stream" id="activity-stream" aria-live="polite"></div>
  </section>

  <section class="conversation" aria-label="Conversation with Wulan">
    <div class="messages" id="messages">
      <div class="message wulan"><span class="message-name">WULAN</span><p>I'm here. Tell me what we're doing.</p></div>
    </div>
    <form class="composer" id="composer">
      <button type="button" class="voice" id="voice" aria-label="Voice input"><span>◉</span></button>
      <input id="nova-input" autocomplete="off" placeholder="Talk to Wulan…" aria-label="Talk to Wulan">
      <button class="send" id="nova-send" aria-label="Send"><span>↗</span></button>
    </form>
    <div class="system-line"><span id="system-state">LOCAL CORE ONLINE</span><span id="memory-hint">MEMORY READY</span><span id="provider-hint">AI GATEWAY · WAITING FOR PROVIDER</span></div>
  </section>

  <nav class="quick" aria-label="Wulan areas">
    <button data-action="memory">Memory</button><button data-action="agents">Agents</button><button data-action="projects">Projects</button><button data-action="systems">Systems</button>
  </nav>
</main>
<script type="module" src="wulan-living.js"></script>
</body>
</html>
